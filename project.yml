# XcodeGen project specification
#
# このファイルは Xcode プロジェクト (.xcodeproj) の真正典です。
# `.xcodeproj` は .gitignore で除外されており、ローカル / CI で都度
# `brew install xcodegen && xcodegen generate` により生成します。
#
# 仕様: https://github.com/yonaskolb/XcodeGen/blob/master/Docs/ProjectSpec.md
#
# 構成:
#   - iPhoneApp  : iOS 17+, SwiftUI + SwiftData
#   - WatchApp   : watchOS 10+, SwiftUI + SwiftData (iPhoneApp に embed)
#
# Shared/ は両ターゲットで共有コンパイル（XcodeGen の `sources:` で
# 明示的に同じパスを両方に含める）。

name: ScheduleManagementTool

options:
  bundleIdPrefix: com.ntdrill
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  groupSortPosition: top
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  iPhoneApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ScheduleManagementTool/iPhoneApp
      - path: ScheduleManagementTool/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ntdrill.schedulemanagementtool
        PRODUCT_NAME: ScheduleManagementTool
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    dependencies:
      - target: WatchApp
        embed: true
        codeSign: true

  WatchApp:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: ScheduleManagementTool/WatchApp
      - path: ScheduleManagementTool/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ntdrill.schedulemanagementtool.watchkitapp
        PRODUCT_NAME: ScheduleManagementTool
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: ScheduleManagementTool
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.ntdrill.schedulemanagementtool
        INFOPLIST_KEY_WKApplication: YES
        INFOPLIST_KEY_WKWatchOnly: NO
