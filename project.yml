# XcodeGen project specification
#
# このファイルは Xcode プロジェクト (.xcodeproj) の真正典です。
# `.xcodeproj` は .gitignore で除外されており、ローカル / CI で都度
# `brew install xcodegen && xcodegen generate` により生成します。
#
# 仕様: https://github.com/yonaskolb/XcodeGen/blob/master/Docs/ProjectSpec.md
#
# 構成:
#   - iPhoneApp  : iOS 17+, SwiftUI + SwiftData
#   - WatchApp   : watchOS 10+, SwiftUI + SwiftData (iPhoneApp に embed)
#
# Shared/ は両ターゲットで共有コンパイル（XcodeGen の `sources:` で
# 明示的に同じパスを両方に含める）。

name: ScheduleManagementTool

options:
  bundleIdPrefix: com.ntdrill
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  groupSortPosition: top
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  iPhoneApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ScheduleManagementTool/iPhoneApp
      - path: ScheduleManagementTool/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ntdrill.schedulemanagementtool
        PRODUCT_NAME: ScheduleManagementTool
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    dependencies:
      - target: WatchApp
        embed: true
        codeSign: true
    scheme:
      testTargets:
        - SharedTests
        - iPhoneAppUITests

  WatchApp:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: ScheduleManagementTool/WatchApp
      - path: ScheduleManagementTool/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ntdrill.schedulemanagementtool.watchkitapp
        PRODUCT_NAME: ScheduleManagementTool
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: ScheduleManagementTool
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.ntdrill.schedulemanagementtool
        INFOPLIST_KEY_WKApplication: YES
        INFOPLIST_KEY_WKWatchOnly: NO
    scheme:
      testTargets:
        - WatchAppTests

  # iOS 単体テスト。Shared/ の純ロジック（Enum 定数・@Model デフォルト・Codable 構造体）を検証する。
  # SwiftData 永続化 (ModelContainer) は使わず、未アタッチの @Model インスタンスでデフォルト値だけ確認する。
  SharedTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ScheduleManagementTool/Tests/SharedTests
    dependencies:
      - target: iPhoneApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ntdrill.schedulemanagementtool.SharedTests
        GENERATE_INFOPLIST_FILE: YES
        # iPhoneApp ターゲットは PRODUCT_NAME=ScheduleManagementTool で上書きしているため、
        # XcodeGen 既定の TEST_HOST=$(BUILT_PRODUCTS_DIR)/iPhoneApp.app/iPhoneApp は
        # 実体パスと噛み合わない。明示的に ScheduleManagementTool.app に向ける。
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/ScheduleManagementTool.app/ScheduleManagementTool
        BUNDLE_LOADER: $(TEST_HOST)

  # watchOS 単体テスト。WatchApp の MeasurementService の状態遷移と
  # HealthKitServicing プロトコル経由のモック注入による更新フローを検証する。
  # SwiftData の ModelContainer は in-memory（isStoredInMemoryOnly: true）で生成。
  WatchAppTests:
    type: bundle.unit-test
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: ScheduleManagementTool/Tests/WatchAppTests
    dependencies:
      - target: WatchApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ntdrill.schedulemanagementtool.watchkitapp.WatchAppTests
        GENERATE_INFOPLIST_FILE: YES
        # WatchApp も PRODUCT_NAME=ScheduleManagementTool 上書き済みのため SharedTests と同様の TEST_HOST 補正。
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/ScheduleManagementTool.app/ScheduleManagementTool
        BUNDLE_LOADER: $(TEST_HOST)

  # iOS UI テスト。アプリ起動直後の TabView スモークのみ。
  # XCUITest なので host app（iPhoneApp）を実機/Simulator で launch する必要があり、
  # `-destination 'platform=iOS Simulator,...'` でしか走らない（generic ビルド不可）。
  iPhoneAppUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ScheduleManagementTool/Tests/iPhoneAppUITests
    dependencies:
      - target: iPhoneApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ntdrill.schedulemanagementtool.iPhoneAppUITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: iPhoneApp
