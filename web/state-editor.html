<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>状態エディタ</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', 'Hiragino Sans', system-ui, sans-serif;
      background: #f5f7fa;
      margin: 0;
      padding: 2rem;
    }
    .editor-container {
      max-width: 900px;
      margin: 0 auto;
      background: white;
      border-radius: 16px;
      padding: 2rem;
      box-shadow: 0 8px 24px rgba(0,0,0,0.1);
    }
    h2 { margin-top: 0; color: #1f2933; }
    .subject-section {
      margin-bottom: 2rem;
      padding: 1.5rem;
      background: #f8f9fa;
      border-radius: 12px;
    }
    .subject-title {
      font-size: 1.1rem;
      font-weight: 600;
      color: #2d9cdb;
      margin-bottom: 1rem;
    }
    .field-group {
      display: grid;
      grid-template-columns: 200px 1fr;
      gap: 1rem;
      align-items: center;
      margin-bottom: 0.75rem;
    }
    .field-group label {
      font-weight: 500;
      color: #3d4852;
    }
    .field-group select,
    .field-group input {
      padding: 0.5rem;
      border: 1px solid #d2d6dc;
      border-radius: 6px;
      font-size: 0.95rem;
    }
    .output-section {
      margin-top: 2rem;
      padding: 1.5rem;
      background: #e8f4f8;
      border-radius: 12px;
    }
    .output-text {
      font-family: 'Courier New', monospace;
      background: white;
      padding: 1rem;
      border-radius: 6px;
      white-space: pre-wrap;
      font-size: 0.9rem;
      border: 1px solid #d2d6dc;
      min-height: 100px;
    }
    .btn-group {
      display: flex;
      gap: 1rem;
      margin-top: 1rem;
    }
    button {
      padding: 0.7rem 1.5rem;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s;
    }
    .btn-primary {
      background: #2d9cdb;
      color: white;
    }
    .btn-primary:hover {
      background: #1a73e8;
      transform: translateY(-1px);
    }
    .btn-secondary {
      background: #e2e8f0;
      color: #3d4852;
    }
    .btn-secondary:hover {
      background: #cbd5e0;
    }
  </style>
</head>
<body>
  <div class="editor-container">
    <h2>状態エディタ</h2>
    <p style="color: #616e7c; margin-bottom: 2rem;">
      フォームで状態を選択すると、自動的にテキスト形式に変換されます。
    </p>

    <!-- ユーザー状態 -->
    <div class="subject-section">
      <div class="subject-title">👤 ユーザー状態</div>
      <div class="field-group">
        <label>神経</label>
        <select id="user-神経">
          <option value="">（未設定）</option>
          <option value="交感優位">交感優位</option>
          <option value="副交感優位">副交感優位</option>
          <option value="バランス">バランス</option>
        </select>
      </div>
      <div class="field-group">
        <label>呼吸</label>
        <select id="user-呼吸">
          <option value="">（未設定）</option>
          <option value="浅い">浅い</option>
          <option value="普通">普通</option>
          <option value="深い">深い</option>
        </select>
      </div>
      <div class="field-group">
        <label>目標</label>
        <input type="text" id="user-目標" placeholder="例: 解離感解消">
      </div>
      <div class="field-group">
        <label>覚醒度</label>
        <select id="user-覚醒度">
          <option value="">（未設定）</option>
          <option value="低">低</option>
          <option value="普通">普通</option>
          <option value="高">高</option>
          <option value="把握">把握</option>
        </select>
      </div>
      <div class="field-group">
        <label>睡眠</label>
        <input type="text" id="user-睡眠" placeholder="例: 覚醒直後">
      </div>
      <div class="field-group">
        <label>デバイス</label>
        <select id="user-デバイス">
          <option value="">（未設定）</option>
          <option value="装着済み">装着済み</option>
          <option value="未装着">未装着</option>
        </select>
      </div>
    </div>

    <!-- 環境状態 -->
    <div class="subject-section">
      <div class="subject-title">🏠 環境状態</div>
      <div class="field-group">
        <label>気温</label>
        <select id="environment-気温">
          <option value="">（未設定）</option>
          <option value="寒い">寒い</option>
          <option value="快適">快適</option>
          <option value="暑い">暑い</option>
        </select>
      </div>
      <div class="field-group">
        <label>静寂</label>
        <select id="environment-静寂">
          <option value="">（未設定）</option>
          <option value="維持">維持</option>
          <option value="静か">静か</option>
          <option value="うるさい">うるさい</option>
        </select>
      </div>
      <div class="field-group">
        <label>清潔度</label>
        <select id="environment-清潔度">
          <option value="">（未設定）</option>
          <option value="低">低</option>
          <option value="中">中</option>
          <option value="高">高</option>
        </select>
      </div>
      <div class="field-group">
        <label>整理整頓</label>
        <select id="environment-整理整頓">
          <option value="">（未設定）</option>
          <option value="散らかっている">散らかっている</option>
          <option value="普通">普通</option>
          <option value="整っている">整っている</option>
        </select>
      </div>
    </div>

    <!-- 社会的状態 -->
    <div class="subject-section">
      <div class="subject-title">👥 社会的状態</div>
      <div class="field-group">
        <label>共有</label>
        <input type="text" id="social-共有" placeholder="例: 家族通知">
      </div>
      <div class="field-group">
        <label>孤独感</label>
        <select id="social-孤独感">
          <option value="">（未設定）</option>
          <option value="低">低</option>
          <option value="中">中</option>
          <option value="高">高</option>
        </select>
      </div>
      <div class="field-group">
        <label>対人ストレス</label>
        <select id="social-対人ストレス">
          <option value="">（未設定）</option>
          <option value="低">低</option>
          <option value="中">中</option>
          <option value="高">高</option>
        </select>
      </div>
    </div>

    <!-- 出力 -->
    <div class="output-section">
      <div class="subject-title">📋 テキスト出力</div>
      <div class="output-text" id="output"></div>
      <div class="btn-group">
        <button class="btn-primary" onclick="copyOutput()">コピー</button>
        <button class="btn-secondary" onclick="clearAll()">クリア</button>
      </div>
    </div>
  </div>

  <script>
    function updateOutput() {
      const lines = [];
      
      // すべての入力要素を取得
      document.querySelectorAll('input, select').forEach(el => {
        if (el.id && el.id !== 'output' && el.value) {
          const [subject, field] = el.id.split('-');
          lines.push(`${subject}.${field}=${el.value}`);
        }
      });
      
      document.getElementById('output').textContent = lines.join('\n') || '（状態が未設定）';
    }

    function copyOutput() {
      const text = document.getElementById('output').textContent;
      if (text === '（状態が未設定）') {
        alert('コピーする内容がありません');
        return;
      }
      navigator.clipboard.writeText(text).then(() => {
        alert('コピーしました！');
      });
    }

    function clearAll() {
      document.querySelectorAll('input, select').forEach(el => {
        if (el.id && el.id !== 'output') {
          el.value = '';
        }
      });
      updateOutput();
    }

    // すべての入力要素にイベントリスナーを追加
    document.querySelectorAll('input, select').forEach(el => {
      if (el.id && el.id !== 'output') {
        el.addEventListener('input', updateOutput);
        el.addEventListener('change', updateOutput);
      }
    });

    // 初期表示
    updateOutput();
  </script>
</body>
</html>
