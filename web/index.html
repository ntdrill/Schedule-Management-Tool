<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Schedule Management Tool</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="app-header">
      <h1>スケジューリング統合ツール</h1>
      <div class="header-controls">
        <label>
          対象日:
          <input type="date" id="schedule-date" />
        </label>
        <button id="reset-day">今日に戻る</button>
      </div>
    </header>

    <main class="layout">
      <section class="panel" id="state-panel">
        <h2>現在の状態</h2>
        <p class="panel-description">
          予定オブジェクトで利用する期待状態／前提条件と比較できるよう、ユーザー・環境・社会的状態を記録します。
        </p>
        <div id="state-editor"></div>
      </section>

      <section class="panel" id="template-panel">
        <h2>タスクテンプレート</h2>
        <p class="panel-description">
          テンプレートは予定オブジェクトの基礎となる再利用可能な型です。前提条件や危篤状態との関連を確認しながら予定に追加できます。
        </p>
        <div class="template-filters">
          <label>
            カテゴリ:
            <select id="template-category-filter">
              <option value="all">すべて</option>
            </select>
          </label>
          <label>
            危篤状態ケア:
            <select id="template-critical-filter">
              <option value="all">すべて</option>
            </select>
          </label>
        </div>
        <div id="template-list"></div>
      </section>

      <section class="panel" id="schedule-panel">
        <h2>予定と実行</h2>
        <p class="panel-description">
          予定オブジェクトと実行オブジェクトのステータスを一元的に管理します。前提条件の適合度や実行後の評価を記録できます。
        </p>
        <div id="schedule-list"></div>
      </section>

      <section class="panel" id="notification-panel">
        <h2>通知とログ</h2>
        <p class="panel-description">
          前提条件の判定や代替タスク提示、状態評価などのイベント履歴を表示します。
        </p>
        <div id="notification-list"></div>
      </section>
    </main>

    <template id="schedule-row-template">
      <article class="schedule-item">
        <header>
          <div>
            <h3 class="schedule-title"></h3>
            <p class="schedule-time"></p>
          </div>
          <span class="schedule-status"></span>
        </header>
        <div class="schedule-body"></div>
        <footer class="schedule-actions"></footer>
      </article>
    </template>

    <template id="notification-template">
      <div class="notification">
        <time></time>
        <p></p>
      </div>
    </template>

    <script type="module" src="data.js"></script>
    <script type="module" src="app.js"></script>
  </body>
</html>
