# SwiftLint configuration for ScheduleManagementTool.
#
# 方針:
#   このファイルは SwiftLint の最初の導入であり、CI を即座に通すことを優先する。
#   既存違反はこのタスクでは直さず、`disabled_rules` か `excluded` で抑制し、
#   別タスク（段階的修正）で対応する。新規ルールを段階的に有効化していくこと。
#
# 段階的に直す候補（将来 disabled_rules から外す順序の一例）:
#   - trailing_whitespace : 末尾空白を除去するだけなので最初に有効化しやすい
#   - line_length         : 1 行 120 文字程度に揃える小タスクで対応
#
# 参考: https://github.com/realm/SwiftLint

included:
  - ScheduleManagementTool

excluded:
  - Tests
  - .build
  - DerivedData
  - build
  - ScheduleManagementTool.xcodeproj
  - ScheduleManagementTool/Tests

disabled_rules:
  # 出発時点で広範に違反しているため一旦無効化。後続タスクで段階的に再有効化する。
  - trailing_whitespace
  - line_length
  - trailing_comma            # 配列リテラル末尾のカンマは Swift 慣用としてプロジェクトで許容
  - redundant_string_enum_value  # Shared/Types/Enums.swift で日本語ラベルとの 1:1 対応を明示するため raw value を残す
  - large_tuple               # SettingsView 等の SwiftUI 内部 (3要素 tuple) を許容、別タスクで構造体化検討
  - cyclomatic_complexity     # 同期受信ハンドラ等の type-by-type 分岐を許容、後続で関数分割タスク化

# identifier_name は再有効化。仕様由来の長い定数名 (40 文字超) は許容するため max_length を緩和。
# 1〜2 文字の超短名はリネーム済 (ms→milliseconds, v/a/f→valence/arousal/focus, ft→fatigue)。
identifier_name:
  min_length:
    warning: 3
    error: 2
  max_length:
    warning: 60
    error: 80
