<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>スケジュール管理ツール</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1>スケジュール管理ツール</h1>
    <p>予定オブジェクトと実行オブジェクトを分離したスケジューリングの実験用UI</p>
  </header>
  <main>
    <section class="panel" id="template-panel">
      <h2>テンプレート辞書</h2>
      <p class="section-description">
        タスクや測定モードなどのテンプレートを登録し、予定オブジェクト作成時に再利用します。
      </p>
      <form id="template-form" class="form-grid">
        <label>種類
          <select name="type" required>
            <option value="task">タスク</option>
            <option value="measurement_session">測定モード</option>
            <option value="checklist">チェックリスト</option>
          </select>
        </label>
        <label>テンプレート名
          <input type="text" name="title" placeholder="例: 太極拳" required />
        </label>
        <label>カテゴリ
          <input type="text" name="category" placeholder="work / exercise / meal など" />
        </label>
        <label>デフォルト所要時間 (分)
          <input type="number" name="defaultDuration" min="5" step="5" value="60" />
        </label>
        <label>表示色 (HEX)
          <input type="color" name="color" value="#2d9cdb" />
        </label>
        <label>アイコン
          <input type="text" name="icon" placeholder="🧘" />
        </label>
        <label>前提状態（Before）
          <textarea name="preconditions" placeholder="user.コンディション=副交感優位"></textarea>
        </label>
        <label>期待状態（After）
          <textarea name="afterEffects" placeholder="user.目標=解離感解消"></textarea>
        </label>
        <label class="full-width">測定モード設定
          <textarea name="measurementSettings" placeholder="sensor=HRV\nfrequency=continuous\nreminder=スマートウォッチを装着"></textarea>
        </label>
        <label class="full-width">チェックリスト項目
          <textarea name="checklistItems" placeholder="起床時間確認?=boolean\n体調コメント=text"></textarea>
        </label>
        <button type="submit" class="primary">テンプレートを登録</button>
      </form>
      <div id="template-list" class="list"></div>
    </section>

    <section class="panel" id="schedule-panel">
      <h2>予定オブジェクトのスケジューリング</h2>
      <p class="section-description">
        テンプレートを基に予定オブジェクトを作成します。予定は不変のスケジュール意図として保持され、実行は別オブジェクトで記録されます。
      </p>
      <form id="schedule-form" class="form-grid">
        <label>テンプレート
          <select name="templateId" required></select>
        </label>
        <label>開始日時
          <input type="datetime-local" name="scheduledStart" required />
        </label>
        <label>終了日時
          <input type="datetime-local" name="scheduledEnd" required />
        </label>
        <label>期待状態 Before
          <textarea name="expectedBefore" placeholder="user.覚醒度=低\nenvironment.明るさ=静か"></textarea>
        </label>
        <label>期待状態 After
          <textarea name="expectedAfter" placeholder="user.心拍=落ち着く\nsocial.連絡=家族に報告済み"></textarea>
        </label>
        <label class="full-width">メモ
          <textarea name="note" placeholder="今回のセッションは通常より長め"></textarea>
        </label>
        <button type="submit" class="primary">予定を作成</button>
      </form>
      <div class="timeline-controls">
        <label>日付選択
          <input type="date" id="timeline-date" />
        </label>
      </div>
      <div id="timeline" class="timeline"></div>
      <div id="schedule-list" class="list"></div>
    </section>

    <section class="panel" id="execution-panel">
      <h2>実行オブジェクトの記録</h2>
      <p class="section-description">
        予定時刻に生成された実行オブジェクトを記録し、期待状態と実際の状態の差分を評価します。
      </p>
      <form id="execution-form" class="form-grid">
        <label>対象の予定
          <select name="scheduledEventId" required></select>
        </label>
        <label>実行開始
          <input type="datetime-local" name="actualStart" required />
        </label>
        <label>実行終了
          <input type="datetime-local" name="actualEnd" required />
        </label>
        <label>実行前状態
          <textarea name="actualBefore" placeholder="user.覚醒度=低"></textarea>
        </label>
        <label>実行後状態
          <textarea name="actualAfter" placeholder="user.覚醒度=安定\nenvironment.清潔度=高"></textarea>
        </label>
        <label>ステータス
          <select name="status" required>
            <option value="in_progress">進行中</option>
            <option value="completed">完了</option>
            <option value="skipped">スキップ</option>
            <option value="failed">失敗</option>
            <option value="interrupted">中断</option>
          </select>
        </label>
        <label class="full-width">振り返りノート
          <textarea name="note" placeholder="実行中に気づいた点"></textarea>
        </label>
        <button type="submit" class="primary">実行を記録</button>
      </form>
      <div id="execution-list" class="list"></div>
    </section>
  </main>
  <footer>
    <p>状態管理（ユーザー・環境・社会）と予定/実行の分離のコンセプトを確認するためのプロトタイプ。</p>
  </footer>
  <script type="module" src="app.js"></script>
</body>
</html>
