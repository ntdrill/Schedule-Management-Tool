# iOS / watchOS build verification on GitHub Actions.
#
# 目的:
#   MacBook 2016 (macOS 12) ではローカル Xcode ビルドが動かないため、
#   GitHub Actions の macos-latest ランナー上で xcodegen → xcodebuild を
#   回して iPhoneApp / WatchApp が型・構文レベルで成立しているかを検証する。
#
# 方針:
#   - 最初は素朴に。キャッシュなし、並列なし、エラー整形なし。
#   - 失敗ログがそのまま Actions UI に出るよう、`set -o pipefail` や
#     `xcpretty` 等のフィルタは挟まない。
#   - public repo 化前提で macos-latest 無料枠で回す。

name: iOS Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build iPhoneApp
        run: xcodebuild -project ScheduleManagementTool.xcodeproj -scheme iPhoneApp -destination 'generic/platform=iOS' build

      - name: Build WatchApp
        run: xcodebuild -project ScheduleManagementTool.xcodeproj -scheme WatchApp -destination 'generic/platform=watchOS' build

      - name: Run SharedTests (iOS Simulator)
        run: xcodebuild test -project ScheduleManagementTool.xcodeproj -scheme iPhoneApp -destination 'platform=iOS Simulator,name=iPhone 15'

      - name: Setup paired Watch + iPhone simulators
        run: |
          set -e
          xcrun simctl list runtimes
          xcrun simctl list pairs
          # macos-latest runner usually ships a pre-paired Apple Watch Series 9 (45mm) + iPhone 15.
          # If the pair is missing, create devices for the latest installed runtimes and pair them.
          if ! xcrun simctl list pairs | grep -q "Apple Watch Series 9 (45mm)"; then
            IOS_RT=$(xcrun simctl list runtimes -j | jq -r '[.runtimes[] | select(.platform=="iOS" and .isAvailable)] | last | .identifier')
            WATCH_RT=$(xcrun simctl list runtimes -j | jq -r '[.runtimes[] | select(.platform=="watchOS" and .isAvailable)] | last | .identifier')
            echo "Using iOS runtime: $IOS_RT"
            echo "Using watchOS runtime: $WATCH_RT"
            PHONE=$(xcrun simctl create "Test iPhone 15" "iPhone 15" "$IOS_RT")
            WATCH=$(xcrun simctl create "Test Apple Watch Series 9 (45mm)" "Apple Watch Series 9 (45mm)" "$WATCH_RT")
            xcrun simctl pair "$PHONE" "$WATCH"
            xcrun simctl list pairs
          fi

      - name: Run WatchAppTests (watchOS Simulator)
        run: xcodebuild test -project ScheduleManagementTool.xcodeproj -scheme WatchAppTests -destination 'platform=watchOS Simulator,name=Apple Watch Series 9 (45mm)'

      - name: Run iPhoneAppUITests (iOS Simulator)
        run: xcodebuild test -project ScheduleManagementTool.xcodeproj -scheme iPhoneAppUITests -destination 'platform=iOS Simulator,name=iPhone 15'
