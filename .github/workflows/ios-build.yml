# iOS / watchOS build verification on GitHub Actions.
#
# 目的:
#   MacBook 2016 (macOS 12) ではローカル Xcode ビルドが動かないため、
#   GitHub Actions の macos-latest ランナー上で xcodegen → xcodebuild を
#   回して iPhoneApp / WatchApp が型・構文レベルで成立しているかを検証する。
#
# 方針:
#   - 最初は素朴に。キャッシュなし、並列なし、エラー整形なし。
#   - 失敗ログがそのまま Actions UI に出るよう、`set -o pipefail` や
#     `xcpretty` 等のフィルタは挟まない。
#   - public repo 化前提で macos-latest 無料枠で回す。

name: iOS Build & Test

on:
  push:
  pull_request:

# 同一ブランチで重複起動した古いジョブはキャンセル。
# main は cancel-in-progress: false にして履歴を保持。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# PR コメント投稿（actions/github-script による issues.createComment）に必要な権限のみ付与。
permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Run SwiftLint (strict)
        run: swiftlint --strict

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      # ランナー上で利用可能な Xcode / SDK / Simulator runtime を最初に明示。
      # ビルドや test の destination 解決失敗を切り分けやすくする。
      - name: Show toolchain & simulator runtimes
        run: |
          sw_vers
          xcodebuild -version
          xcrun --show-sdk-path --sdk iphonesimulator || true
          xcrun --show-sdk-path --sdk watchsimulator || true
          xcrun simctl list runtimes
          xcrun simctl list devices available

      # CI 上で実機 Provisioning が無いため Simulator 向け汎用ターゲットでビルドし、
      # かつ全ターゲットの code signing を完全に無効化する。
      - name: Build iPhoneApp
        run: xcodebuild -project ScheduleManagementTool.xcodeproj -scheme iPhoneApp -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build

      - name: Build WatchApp
        run: xcodebuild -project ScheduleManagementTool.xcodeproj -scheme WatchApp -destination 'generic/platform=watchOS Simulator' CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build

      - name: Run SharedTests (iOS Simulator)
        run: xcodebuild test -project ScheduleManagementTool.xcodeproj -scheme iPhoneApp -destination 'platform=iOS Simulator,name=iPhone 16' CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" -enableCodeCoverage YES -resultBundlePath TestResults-SharedTests.xcresult

      - name: Setup paired Watch + iPhone simulators
        run: |
          set -e
          xcrun simctl list runtimes
          xcrun simctl list pairs
          # macos-latest runner ships iPhone 16/17 系 + Apple Watch Series 9/10/11。
          # 既存ペアがなければ最新ランタイムで iPhone 16 + Apple Watch Series 9 (45mm) を作って pair。
          if ! xcrun simctl list pairs | grep -q "Apple Watch Series 9 (45mm)"; then
            IOS_RT=$(xcrun simctl list runtimes -j | jq -r '[.runtimes[] | select(.platform=="iOS" and .isAvailable)] | last | .identifier')
            WATCH_RT=$(xcrun simctl list runtimes -j | jq -r '[.runtimes[] | select(.platform=="watchOS" and .isAvailable)] | last | .identifier')
            echo "Using iOS runtime: $IOS_RT"
            echo "Using watchOS runtime: $WATCH_RT"
            PHONE=$(xcrun simctl create "Test iPhone 16" "iPhone 16" "$IOS_RT")
            WATCH=$(xcrun simctl create "Test Apple Watch Series 9 (45mm)" "Apple Watch Series 9 (45mm)" "$WATCH_RT")
            xcrun simctl pair "$PHONE" "$WATCH"
            xcrun simctl list pairs
          fi

      - name: Run WatchAppTests (watchOS Simulator)
        run: xcodebuild test -project ScheduleManagementTool.xcodeproj -scheme WatchAppTests -destination 'platform=watchOS Simulator,name=Apple Watch Series 9 (45mm)' CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" -enableCodeCoverage YES -resultBundlePath TestResults-WatchAppTests.xcresult

      - name: Run iPhoneAppUITests (iOS Simulator)
        run: xcodebuild test -project ScheduleManagementTool.xcodeproj -scheme iPhoneAppUITests -destination 'platform=iOS Simulator,name=iPhone 16' CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" -enableCodeCoverage YES -resultBundlePath TestResults-iPhoneAppUITests.xcresult

      # Coverage 可視化 (閾値判定なし)。xccov view --report --json で各 xcresult を JSON 化し、
      # xcresult バンドル本体と合わせて Actions 成果物として残す。テスト失敗時もアップロードする。
      - name: Generate coverage JSON from xcresult bundles
        if: always()
        run: |
          for bundle in TestResults-SharedTests.xcresult TestResults-WatchAppTests.xcresult TestResults-iPhoneAppUITests.xcresult; do
            if [ -d "$bundle" ]; then
              out="coverage-${bundle%.xcresult}.json"
              xcrun xccov view --report --json "$bundle" > "$out" || echo "coverage extraction failed for $bundle"
            else
              echo "skip: $bundle does not exist"
            fi
          done
          ls -la TestResults-*.xcresult coverage-*.json 2>/dev/null || true

      # 失敗時も xcresult を必ず残す。ビルド/テストいずれかが失敗してジョブが
      # 止まっても、Actions UI から原因解析できるよう if: always() で固定。
      - name: Upload xcresult bundles & coverage JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-and-coverage
          path: |
            TestResults-*.xcresult
            coverage-*.json
          if-no-files-found: warn

      # PR にカバレッジ 1 行サマリをコメント投稿（push 時はスキップ）。
      # coverage-*.json から行カバレッジ率を抜き出して 1 コメントにまとめる。
      - name: Comment coverage summary on PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const files = fs.readdirSync('.').filter(f => f.startsWith('coverage-') && f.endsWith('.json'));
            const lines = ['## iOS Build & Test — Coverage Summary', ''];
            if (files.length === 0) {
              lines.push('_No coverage JSON found (tests may have failed before producing xcresult)._');
            } else {
              lines.push('| Test bundle | Line coverage |');
              lines.push('|---|---|');
              for (const f of files.sort()) {
                let pct = 'n/a';
                try {
                  const data = JSON.parse(fs.readFileSync(f, 'utf8'));
                  if (typeof data.lineCoverage === 'number') {
                    pct = (data.lineCoverage * 100).toFixed(2) + ' %';
                  }
                } catch (e) {
                  pct = 'parse error';
                }
                lines.push(`| \`${f}\` | ${pct} |`);
              }
            }
            lines.push('');
            lines.push(`<sub>commit: \`${context.sha.slice(0, 7)}\` · workflow: ${context.workflow}</sub>`);
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: lines.join('\n'),
            });
